<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Viewer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .toolbar a { color: #2563eb; text-decoration: none; font-size: 14px; font-weight: 500; }
    .toolbar a:hover { text-decoration: underline; }
    .email-container {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }
    #emailContent { padding: 24px; }
    .loading { text-align: center; padding: 60px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="?" onclick="google.script.history.push(null, {page:'index'});return false;">Back to Knowledgebase</a>
    <span id="entryId" style="font-size:12px;color:#94a3b8;"></span>
  </div>
  <div class="email-container">
    <div id="emailContent" class="loading">Loading email...</div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var entryId = params.get('entryId');
    document.getElementById('entryId').textContent = entryId || '';

    if (entryId) {
      google.script.run
        .withSuccessHandler(function(html) {
          document.getElementById('emailContent').innerHTML = html;
        })
        .withFailureHandler(function(err) {
          document.getElementById('emailContent').innerHTML = '<p>Error: ' + err.message + '</p>';
        })
        .getEmailHtml(entryId);
    } else {
      document.getElementById('emailContent').innerHTML = '<p>No entry specified.</p>';
    }
  </script>
</body>
</html>
